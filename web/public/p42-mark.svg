<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="P42 mark: the order-4 Hadamard matrix, defect 0">
  <!-- The P42 mark is H4, the order-4 Hadamard matrix (rows ++++, +-+-, ++--, +--+).
       Solid cells are +1, faint cells are -1. Every pair of rows is orthogonal:
       the logo itself passes `make verify`. -->
  <g fill="#181511">
    <rect x="2" y="2" width="20" height="20" rx="3"/><rect x="26" y="2" width="20" height="20" rx="3"/><rect x="50" y="2" width="20" height="20" rx="3"/><rect x="74" y="2" width="20" height="20" rx="3"/>
    <rect x="2" y="26" width="20" height="20" rx="3"/><rect x="50" y="26" width="20" height="20" rx="3"/>
    <rect x="2" y="50" width="20" height="20" rx="3"/><rect x="26" y="50" width="20" height="20" rx="3"/>
    <rect x="2" y="74" width="20" height="20" rx="3"/><rect x="74" y="74" width="20" height="20" rx="3"/>
  </g>
  <g fill="#181511" fill-opacity="0.18">
    <rect x="26" y="26" width="20" height="20" rx="3"/><rect x="74" y="26" width="20" height="20" rx="3"/>
    <rect x="50" y="50" width="20" height="20" rx="3"/><rect x="74" y="50" width="20" height="20" rx="3"/>
    <rect x="26" y="74" width="20" height="20" rx="3"/><rect x="50" y="74" width="20" height="20" rx="3"/>
  </g>
</svg>
