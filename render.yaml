# P42 Prizes standalone portal.
# Canonical public route: https://projectforty2.ai/prizes
services:
  - type: web
    name: p42-prizes
    runtime: node
    rootDir: ./web
    buildCommand: npm ci && npm run build:prizes
    startCommand: npm run start:prizes
    plan: starter
    region: oregon
    healthCheckPath: /prizes
    envVars:
      - key: NEXT_PUBLIC_BASE_PATH
        value: /prizes
      - key: P42_PORTAL_STATE_PATH
        value: /app/data/portal-state.json
      # Fail closed on the live service: commit/reveal/challenge/solutions
      # mutations require a valid API key. Local dev/test leave this unset so the
      # gate stays off by default.
      - key: P42_REQUIRE_MUTATION_API_KEY
        value: "1"
      # Comma-separated sha256:<hex> hashes of the accepted mutation API keys.
      # Operator-provided in the Render dashboard (sync: false); never commit a
      # real secret here. Enforcement 503s until a valid hash is set.
      - key: P42_MUTATION_API_KEY_SHA256S
        sync: false
    disk:
      name: p42-prizes-state
      mountPath: /app/data
      sizeGB: 1
