# P42 Prizes standalone portal.
# Canonical public route: https://projectforty2.ai/prizes
services:
  - type: web
    name: p42-prizes
    runtime: node
    rootDir: ./web
    buildCommand: npm ci && npm run build:prizes
    startCommand: npm run db:migrate && exec env -u P42_PORTAL_MIGRATION_DATABASE_URL npm run start:prizes
    plan: starter
    region: oregon
    healthCheckPath: /prizes
    envVars:
      - key: NEXT_PUBLIC_BASE_PATH
        value: /prizes
      - key: P42_PORTAL_STATE_PATH
        value: /app/data/portal-state.json
      # Operator-provided Render internal PostgreSQL URL. Startup runs the
      # idempotent migration and refuses to start if the schema is not ready.
      - key: P42_PORTAL_DATABASE_URL
        sync: false
      # Distinct schema-owner credential used only by the startup migration.
      # The start command replaces its migration shell with an environment that
      # omits this value before launching the web process. It must authenticate
      # as a different role from P42_PORTAL_DATABASE_URL.
      - key: P42_PORTAL_MIGRATION_DATABASE_URL
        sync: false
      # Preprovision this exact schema under the migration owner. Runtime has
      # USAGE only; checkpoint relations/functions are OID-bound inside it.
      - key: P42_PORTAL_DATABASE_SCHEMA
        value: p42_portal
      # Exact provisioned identity and database. Startup rejects drift before
      # applying migrations or changing ACLs.
      - key: P42_PORTAL_RUNTIME_ROLE
        value: p42_portal_runtime
      - key: P42_PORTAL_DATABASE_NAME
        sync: false
      - key: P42_PORTAL_DATABASE_REQUIRED
        value: "1"
      # Funding publication remains disabled until the complete activation
      # artifact set is mounted. These two values identify the protected RPC
      # registry and its independently configured trusted root. Provision the
      # mounted file owner-owned, nlink=1, mode 0400/0444, as minified sorted
      # canonical JSON with exactly one trailing LF; writable files fail closed.
      - key: P42_ACTIVATION_RPC_OPERATOR_REGISTRY_PATH
        sync: false
      - key: P42_ACTIVATION_RPC_OPERATOR_REGISTRY_TRUSTED_ROOT
        sync: false
      # Production code fails closed automatically. Only a non-production local
      # process can opt out, with P42_ALLOW_UNAUTHENTICATED_MUTATIONS=1.
      # Strict JSON array of {hash, scopes, optional expiresAt} records. Hashes
      # are sha256:<64 lowercase hex>; plaintext keys never enter Render config.
      # Operator-provided in the dashboard (sync: false). Enforcement 503s until
      # a valid scoped policy is set; the legacy flat hash variable is rejected.
      - key: P42_MUTATION_API_CREDENTIALS_JSON
        sync: false
    disk:
      name: p42-prizes-state
      mountPath: /app/data
      sizeGB: 1
