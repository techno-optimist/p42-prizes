name: CI

on:
  push:
    branches:
      - main
  pull_request:

# CI needs repository contents only. Release/deployment credentials never run here.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python verifier gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install package with test extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Install resolver dependencies for cross-runtime tests
        working-directory: agent
        run: npm ci
      - name: Validate problem packages
        run: make validate
      - name: Lint certified-path exactness
        run: make lint
      - name: Run Python tests
        run: make test
      - name: Verify seed fixtures
        run: make verify-seed

  agent:
    name: Autonomous agent gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - name: Install agent dependencies
        run: npm ci
      - name: Install contract build dependencies
        working-directory: contracts
        run: npm ci
      - name: Compile contract artifacts
        working-directory: contracts
        run: npm run build
      - name: Run agent tests
        run: npm test
      - name: Validate censorship fallback supervisor units
        working-directory: .
        run: bash scripts/verify-censorship-fallback-systemd.sh
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  web:
    name: Portal gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run portal database integrations
        env:
          P42_PORTAL_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          npm run db:migration-integration
          npm run db:transfer-legacy-integration
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Run portal tests
        run: npm test
      - name: Production build
        run: |
          rm -rf node_modules
          npm ci --omit=optional
          npm run build:prizes
      - name: Verify production dependency boundary
        run: |
          if npm ls sharp --omit=optional; then
            echo "sharp must not be present in the optional-free production artifact"
            exit 1
          fi

  contracts:
    name: Contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install shared agent dependencies
        working-directory: agent
        run: npm ci
      - name: Install dependencies
        run: npm ci
      - name: Compile contracts
        run: npm run build
      - name: Run contract tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  objective-program:
    name: SP1 objective-program gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install pinned SP1 v6.1 verifier CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-prove.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/succinctlabs/sp1/releases/download/v6.1.0/cargo_prove_v6.1.0_linux_amd64.tar.gz \
            --output "$archive"
          echo "99f0087f581798ec510573baedcd51b97a32c6f6a1f5942612ed252e5285954b  $archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/cargo-prove"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/cargo-prove"
          test -f "$RUNNER_TEMP/cargo-prove/cargo-prove"
          test ! -L "$RUNNER_TEMP/cargo-prove/cargo-prove"
          chmod 700 "$RUNNER_TEMP/cargo-prove/cargo-prove"
          echo "$RUNNER_TEMP/cargo-prove" >> "$GITHUB_PATH"
      - name: Install pinned host and SP1 guest toolchains
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.1 --profile minimal
          cargo-prove prove install-toolchain
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
      - name: Restore pinned Rust build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry
          key: sp1-v6.1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('objective-programs/Cargo.lock', 'objective-programs/q6-intersecting-hypergraph/Cargo.lock', 'objective-programs/edges-vs-triangles/Cargo.lock') }}
      - name: Capture untrusted SP1 build-input observation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf objective-programs/target
          rm -rf "$HOME/.cargo/git"
          test ! -e objective-programs/target
          guest_archive="$HOME/.sp1/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz"
          guest_sysroot="$(rustc +succinct --print sysroot)"
          python3 scripts/verify-sp1-objective-artifact.py \
            --cargo-prove "$RUNNER_TEMP/cargo-prove/cargo-prove" \
            --cargo-prove-archive "$RUNNER_TEMP/cargo-prove.tar.gz" \
            --guest-toolchain-archive "$guest_archive" \
            --guest-sysroot "$guest_sysroot" \
            --cargo-home "$HOME/.cargo" \
            --capture-build-observation "$RUNNER_TEMP/sp1-build-input-observation.json"
      - name: Retain untrusted SP1 build-input observation
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p42-untrusted-sp1-build-inputs-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sp1-build-input-observation.json
          if-no-files-found: warn
          retention-days: 7
      - name: Validate clean SP1 build-input provenance
        shell: bash
        run: |
          set -euo pipefail
          test ! -e objective-programs/target
          clean_path="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
          clean_env=(/usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1)
          guest_archive="$HOME/.sp1/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz"
          guest_sysroot="$("${clean_env[@]}" "$HOME/.cargo/bin/rustc" +succinct --print sysroot)"
          "${clean_env[@]}" /usr/bin/python3 scripts/verify-sp1-objective-artifact.py \
            --cargo-prove "$RUNNER_TEMP/cargo-prove/cargo-prove" \
            --cargo-prove-archive "$RUNNER_TEMP/cargo-prove.tar.gz" \
            --guest-toolchain-archive "$guest_archive" \
            --guest-sysroot "$guest_sysroot" \
            --cargo-home "$HOME/.cargo" \
            --capture-build-provenance "$RUNNER_TEMP/sp1-build-provenance.json"
      - name: Enforce SP1 build disk budget
        shell: bash
        run: |
          set -euo pipefail
          cleanup_paths=(
            /usr/local/lib/android
            /usr/share/dotnet
            /opt/ghc
            /usr/local/share/boost
          )
          for path in "${cleanup_paths[@]}"; do
            if [[ ! -e "$path" ]]; then
              continue
            fi
            if [[ ! -d "$path" || -L "$path" ]]; then
              echo "refusing unsafe runner cleanup path: $path" >&2
              exit 1
            fi
            sudo find "$path" -xdev -mindepth 1 -delete
          done
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_kib=$((20 * 1024 * 1024))
          printf 'SP1 build disk budget: available=%s KiB required=%s KiB\n' \
            "$available_kib" "$required_kib"
          if (( available_kib < required_kib )); then
            echo "insufficient disk for isolated SP1 workspaces" >&2
            exit 1
          fi
      - name: Test objective predicate and Solidity ABI encoding
        working-directory: objective-programs
        shell: bash
        run: |
          clean_path="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            "$HOME/.cargo/bin/cargo" test --locked -p p42-objective-core
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            "$HOME/.cargo/bin/cargo" test --locked \
            --manifest-path q6-intersecting-hypergraph/Cargo.toml \
            -p p42-q6-objective-core
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            "$HOME/.cargo/bin/cargo" test --locked \
            --manifest-path edges-vs-triangles/Cargo.toml \
            -p p42-edges-objective-core
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            "$HOME/.cargo/bin/cargo" test --locked \
            --manifest-path erdos-min-overlap/Cargo.toml \
            -p p42-three-objective-shared \
            -p p42-erdos-min-overlap-objective-core
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            "$HOME/.cargo/bin/cargo" test --locked \
            --manifest-path autoconvolution-c1-upper/Cargo.toml \
            -p p42-autoconvolution-c1-upper-objective-core
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            "$HOME/.cargo/bin/cargo" test --locked \
            --manifest-path autoconvolution-c2-lower/Cargo.toml \
            -p p42-autoconvolution-c2-lower-objective-core
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" PYTHONPATH="$GITHUB_WORKSPACE/src" \
            /usr/bin/python3 erdos-min-overlap/objective-shared/tests/test_python_authority.py \
            --canonical-root "$GITHUB_WORKSPACE" --source-mode current
      - name: Build objective guests on x86 Linux
        working-directory: objective-programs
        shell: bash
        run: |
          set -euo pipefail
          clean_path="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
          clean_env=(/usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1)
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" build --locked \
            -p p42-hadamard-668-objective-script \
            -p p42-distinct-subset-sums-a11-objective-script
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" build --locked \
            --manifest-path q6-intersecting-hypergraph/Cargo.toml \
            -p p42-q6-objective-script
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" build --locked \
            --manifest-path edges-vs-triangles/Cargo.toml \
            -p p42-edges-objective-script
          for rebuilt in \
            target/elf-compilation/riscv64im-succinct-zkvm-elf/release/p42-hadamard-668-objective-program \
            target/elf-compilation/riscv64im-succinct-zkvm-elf/release/p42-distinct-subset-sums-a11-objective-program \
            q6-intersecting-hypergraph/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/p42-q6-objective-program \
            edges-vs-triangles/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/p42-edges-objective-program; do
              sha256sum "$rebuilt"
              host_paths="$(strings "$rebuilt" | grep --extended-regexp '/home/runner/(work/p42-prizes|\.cargo|\.rustup)|/opt/hostedtoolcache|/private/tmp/p42' || true)"
              # The pinned SP1 guest sysroot itself carries this canonical hashbrown source path.
              unexpected_paths="$(printf '%s\n' "$host_paths" | grep --invert-match --fixed-strings --line-regexp '/home/runner/.cargo/registry/src/index.crates.io-1949cf8c6b5b557f/hashbrown-0.16.1/src/raw/mod.rs' || true)"
              if [[ -n "$unexpected_paths" ]]; then
                printf '%s\n' "$unexpected_paths"
                echo "guest ELF leaked a host-specific source path: $rebuilt" >&2
                exit 1
              fi
          done
          hadamard=target/elf-compilation/riscv64im-succinct-zkvm-elf/release/p42-hadamard-668-objective-program
          hadamard_audit=target/hadamard-reproducibility
          mkdir -p "$hadamard_audit"
          cp "$hadamard" "$hadamard_audit/program.elf"
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" run --locked -p p42-hadamard-668-objective-script -- \
            identity-elf "$hadamard" > "$hadamard_audit/identity.json"
          a11=target/elf-compilation/riscv64im-succinct-zkvm-elf/release/p42-distinct-subset-sums-a11-objective-program
          audit=target/a11-reproducibility
          mkdir -p "$audit"
          cp "$a11" "$audit/program.elf"
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" run --locked -p p42-distinct-subset-sums-a11-objective-script -- \
            identity-elf "$a11" > "$audit/identity.json"
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" run --locked -p p42-distinct-subset-sums-a11-objective-script -- \
            execute-fixture-elf "$a11" ../problems/distinct-subset-sums-a11/tests/conway-guy-594.json \
            > "$audit/execution.json"
          q6_elf=q6-intersecting-hypergraph/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/p42-q6-objective-program
          q6_audit=target/q6-reproducibility
          mkdir -p "$q6_audit"
          cp "$q6_elf" "$q6_audit/program.elf"
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" run --locked \
            --manifest-path q6-intersecting-hypergraph/Cargo.toml \
            -p p42-q6-objective-script -- \
            identity-elf "$q6_elf" > "$q6_audit/identity.json"
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" run --locked \
            --manifest-path q6-intersecting-hypergraph/Cargo.toml \
            -p p42-q6-objective-script -- \
            execute-fixture-elf "$q6_elf" ../problems/q6-intersecting-hypergraph/tests/seed-pg25.json \
            > "$q6_audit/execution.json"
          "${clean_env[@]}" /usr/bin/python3 ../scripts/verify-sp1-objective-reproduction.py \
            --program q6-intersecting-hypergraph \
            --directory "$q6_audit" \
            --write-source-manifest
          edges_elf=edges-vs-triangles/target/elf-compilation/riscv64im-succinct-zkvm-elf/release/p42-edges-objective-program
          edges_audit=target/edges-reproducibility
          mkdir -p "$edges_audit"
          cp "$edges_elf" "$edges_audit/program.elf"
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" run --locked \
            --manifest-path edges-vs-triangles/Cargo.toml \
            -p p42-edges-objective-script -- \
            identity-elf "$edges_elf" > "$edges_audit/identity.json"
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" run --locked \
            --manifest-path edges-vs-triangles/Cargo.toml \
            -p p42-edges-objective-script -- \
            execute-fixture-elf "$edges_elf" ../problems/edges-vs-triangles/examples/rational-curve-sample.json \
            > "$edges_audit/execution.json"
          "${clean_env[@]}" "$HOME/.cargo/bin/cargo" run --locked \
            --manifest-path edges-vs-triangles/Cargo.toml \
            -p p42-edges-objective-script -- \
            execute-fixture-elf "$edges_elf" edges-vs-triangles/fixtures/worst-case-500-rows.json \
            > "$edges_audit/resource.json"
          "${clean_env[@]}" /usr/bin/python3 ../scripts/verify-sp1-objective-reproduction.py \
            --program edges-vs-triangles \
            --directory "$edges_audit" \
            --write-source-manifest
      - name: Capture candidate Hadamard mock execution
        working-directory: objective-programs
        shell: bash
        run: |
          set -euo pipefail
          clean_path="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            "$HOME/.cargo/bin/cargo" run --locked -p p42-hadamard-668-objective-script -- \
            execute-fixture-elf target/hadamard-reproducibility/program.elf \
            ../problems/hadamard-668-defect/examples/sylvester-prefix.json \
            > target/hadamard-reproducibility/execution.json
      - name: Retain untrusted A11 candidate forensics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p42-untrusted-a11-candidate-${{ matrix.os }}-${{ github.run_id }}
          path: objective-programs/target/a11-reproducibility
          if-no-files-found: warn
          retention-days: 7
      - name: Retain untrusted Hadamard candidate forensics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p42-untrusted-hadamard-candidate-${{ matrix.os }}-${{ github.run_id }}
          path: objective-programs/target/hadamard-reproducibility
          if-no-files-found: warn
          retention-days: 7
      - name: Retain untrusted Q6 candidate forensics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p42-untrusted-q6-candidate-${{ matrix.os }}-${{ github.run_id }}
          path: objective-programs/target/q6-reproducibility
          if-no-files-found: warn
          retention-days: 7
      - name: Retain untrusted Edges candidate forensics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p42-untrusted-edges-candidate-${{ matrix.os }}-${{ github.run_id }}
          path: objective-programs/target/edges-reproducibility
          if-no-files-found: warn
          retention-days: 7
      - name: Validate program-scoped reproduction bundles
        working-directory: objective-programs
        shell: bash
        run: |
          clean_path="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            /usr/bin/python3 ../scripts/verify-sp1-objective-reproduction.py \
            --program distinct-subset-sums-a11 --directory target/a11-reproducibility
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            /usr/bin/python3 ../scripts/verify-sp1-objective-reproduction.py \
            --program hadamard-668-defect --directory target/hadamard-reproducibility
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            /usr/bin/python3 ../scripts/verify-sp1-objective-reproduction.py \
            --program q6-intersecting-hypergraph --directory target/q6-reproducibility
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            /usr/bin/python3 ../scripts/verify-sp1-objective-reproduction.py \
            --program edges-vs-triangles --directory target/edges-reproducibility
      - name: Enforce frozen guest identity
        working-directory: objective-programs
        shell: bash
        run: |
          set -euo pipefail
          rebuilt=target/elf-compilation/riscv64im-succinct-zkvm-elf/release/p42-hadamard-668-objective-program
          echo "bada920c00cb68bb8462e461c13eeb8240bde7c1d9af17b5d517c1a54b31ecb2  $rebuilt" | sha256sum --check --strict
          frozen=artifacts/hadamard-668-defect/v0.1.0/program.elf
          cmp --silent "$rebuilt" "$frozen"
          echo "bada920c00cb68bb8462e461c13eeb8240bde7c1d9af17b5d517c1a54b31ecb2  $frozen" | sha256sum --check --strict
          rebuilt_a11=target/elf-compilation/riscv64im-succinct-zkvm-elf/release/p42-distinct-subset-sums-a11-objective-program
          echo "f7350b3182568fed19536cfa7ea3f3909cbee9bd3f3a0201ac2d9e88ba1074ae  $rebuilt_a11" | sha256sum --check --strict
          frozen_a11=artifacts/distinct-subset-sums-a11/v0.1.0/program.elf
          cmp --silent "$rebuilt_a11" "$frozen_a11"
          echo "f7350b3182568fed19536cfa7ea3f3909cbee9bd3f3a0201ac2d9e88ba1074ae  $frozen_a11" | sha256sum --check --strict
      - name: Verify frozen ELF and independently derive vkey
        shell: bash
        run: |
          set -euo pipefail
          clean_path="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
          clean_env=(/usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1)
          guest_sysroot="$("${clean_env[@]}" "$HOME/.cargo/bin/rustc" +succinct --print sysroot)"
          "${clean_env[@]}" /usr/bin/python3 scripts/verify-sp1-objective-artifact.py \
            --cargo-prove "$RUNNER_TEMP/cargo-prove/cargo-prove" \
            --cargo-prove-archive "$RUNNER_TEMP/cargo-prove.tar.gz" \
            --guest-toolchain-archive "$HOME/.sp1/rust-toolchain-x86_64-unknown-linux-gnu.tar.gz" \
            --guest-sysroot "$guest_sysroot" \
            --cargo-home "$HOME/.cargo" \
            --build-provenance "$RUNNER_TEMP/sp1-build-provenance.json"
          "${clean_env[@]}" /usr/bin/python3 scripts/verify-sp1-a11-objective-artifact.py --cargo-prove "$RUNNER_TEMP/cargo-prove/cargo-prove"
      - name: Verify deterministic resource envelope
        shell: bash
        run: |
          clean_path="$HOME/.cargo/bin:/usr/local/bin:/usr/bin:/bin"
          /usr/bin/env -i HOME="$HOME" PATH="$clean_path" CARGO_INCREMENTAL=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            /usr/bin/python3 scripts/verify-sp1-objective-resource-profile.py
      - name: Retain validated objective evidence for cross-image audit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p42-validated-distinct-subset-sums-a11-x86-elf-${{ matrix.os }}-${{ github.run_id }}
          path: objective-programs/target/a11-reproducibility
          if-no-files-found: error
          retention-days: 7
      - name: Retain validated Hadamard evidence for cross-image audit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p42-validated-hadamard-668-x86-elf-${{ matrix.os }}-${{ github.run_id }}
          path: objective-programs/target/hadamard-reproducibility
          if-no-files-found: error
          retention-days: 7
      - name: Retain validated Q6 candidate evidence for cross-image audit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p42-validated-q6-candidate-${{ matrix.os }}-${{ github.run_id }}
          path: objective-programs/target/q6-reproducibility
          if-no-files-found: error
          retention-days: 7
      - name: Retain validated Edges candidate evidence for cross-image audit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p42-validated-edges-candidate-${{ matrix.os }}-${{ github.run_id }}
          path: objective-programs/target/edges-reproducibility
          if-no-files-found: error
          retention-days: 7
      - name: Retain validated SP1 build provenance for cross-image audit
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: p42-validated-sp1-build-provenance-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/sp1-build-provenance.json
          if-no-files-found: error
          retention-days: 7

  objective-program-reproducibility:
    name: SP1 objective-program reproducibility
    needs: objective-program
    if: ${{ always() && needs.objective-program.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    env:
      PRODUCER_RESULT: ${{ needs.objective-program.result }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.2
      - name: Reject failed producer before consuming validated evidence
        shell: bash
        run: |
          if [[ "$PRODUCER_RESULT" != success ]]; then
            echo "objective-program producer validation failed: $PRODUCER_RESULT" >&2
            exit 1
          fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: p42-validated-distinct-subset-sums-a11-x86-elf-*-${{ github.run_id }}
          path: objective-programs/reproduced-a11
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: p42-validated-hadamard-668-x86-elf-*-${{ github.run_id }}
          path: objective-programs/reproduced-hadamard
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: p42-validated-q6-candidate-*-${{ github.run_id }}
          path: objective-programs/reproduced-q6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: p42-validated-edges-candidate-*-${{ github.run_id }}
          path: objective-programs/reproduced-edges
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: p42-validated-sp1-build-provenance-*-${{ github.run_id }}
          path: objective-programs/reproduced-provenance
      - name: Compare dual-image objective guests
        shell: bash
        run: |
          set -euo pipefail
          compare_pair() {
            local root=$1
            local program=$2
            mapfile -t guests < <(find "$root" -type f -name program.elf | sort)
            mapfile -t identities < <(find "$root" -type f -name identity.json | sort)
            mapfile -t executions < <(find "$root" -type f -name execution.json | sort)
            mapfile -t sources < <(find "$root" -type f -name source.json | sort)
            mapfile -t resources < <(find "$root" -type f -name resource.json | sort)
            test "${#guests[@]}" -eq 2
            test "${#identities[@]}" -eq 2
            test "${#executions[@]}" -eq 2
            if [[ "$program" == q6-intersecting-hypergraph || "$program" == edges-vs-triangles ]]; then
              test "${#sources[@]}" -eq 2
            else
              test "${#sources[@]}" -eq 0
            fi
            if [[ "$program" == edges-vs-triangles ]]; then
              test "${#resources[@]}" -eq 2
            else
              test "${#resources[@]}" -eq 0
            fi
            for identity in "${identities[@]}"; do
              /usr/bin/python3 scripts/verify-sp1-objective-reproduction.py \
                --program "$program" --directory "$(dirname "$identity")"
            done
            cmp --silent "${guests[0]}" "${guests[1]}"
            cmp --silent "${identities[0]}" "${identities[1]}"
            cmp --silent "${executions[0]}" "${executions[1]}"
            if [[ "${#sources[@]}" -eq 2 ]]; then
              cmp --silent "${sources[0]}" "${sources[1]}"
            fi
            if [[ "${#resources[@]}" -eq 2 ]]; then
              cmp --silent "${resources[0]}" "${resources[1]}"
            fi
            sha256sum "${guests[@]}" "${identities[@]}" "${executions[@]}" "${sources[@]}" "${resources[@]}"
          }
          compare_pair objective-programs/reproduced-hadamard hadamard-668-defect
          compare_pair objective-programs/reproduced-a11 distinct-subset-sums-a11
          compare_pair objective-programs/reproduced-q6 q6-intersecting-hypergraph
          compare_pair objective-programs/reproduced-edges edges-vs-triangles
          mapfile -t provenances < <(find objective-programs/reproduced-provenance -type f -name sp1-build-provenance.json | sort)
          test "${#provenances[@]}" -eq 2
          cmp --silent "${provenances[0]}" "${provenances[1]}"
          sha256sum "${provenances[@]}"
